<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>CareSync 整合抉擇</title>
<style>
:root{
  --navy:#183149; --navy-2:#24476a; --gold:#B59B62; --bg:#F7F5F0; --card:#ffffff;
  --text:#1d2630; --muted:#4a5560; --line:#d9d3c5; --line-strong:#7d848c;
  --note:#efe9dc; --danger:#9b1c1c; --danger-bg:#fdf1f1; --ok-bg:#eef3f7;
  --fs:18px;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Microsoft JhengHei UI",sans-serif;
  overflow-wrap:anywhere}
.wrap{max-width:46rem;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{color:var(--navy);line-height:1.4}
h1{font-size:1.55rem;margin:.25rem 0 1rem}
h2{font-size:1.25rem;margin:1.75rem 0 .5rem}
h3{font-size:1.05rem;margin:1rem 0 .25rem}
p{margin:.5rem 0 .9rem}
.en{font-family:Georgia,"Times New Roman",serif}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn:focus-visible{outline-offset:3px}
[hidden]{display:none !important}

/* header */
header.app{background:var(--bg);border-bottom:1px solid var(--line)}
@media (min-height:560px){header.app{position:sticky;top:env(safe-area-inset-top, 0px);z-index:10}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.25rem .5rem;padding-top:.35rem;padding-bottom:.35rem}
.brand{display:flex;align-items:baseline;gap:.4rem;flex-wrap:wrap}
.brand-en{font-family:Georgia,"Times New Roman",serif;font-weight:700;color:var(--navy);font-size:1.15rem}
.brand-zh{color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:.4rem}
.progress{padding-bottom:.4rem;font-size:.85rem;color:var(--muted)}
.pbar{height:4px;background:var(--line);border-radius:2px;margin-top:.25rem;overflow:hidden}
.pbar > span{display:block;height:100%;background:var(--gold)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:44px;min-width:44px;
  padding:.45rem 1rem;border-radius:8px;font:inherit;font-size:1rem;line-height:1.3;cursor:pointer;text-decoration:none;
  border:2px solid var(--navy);background:#fff;color:var(--navy)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-ghost{border-color:var(--line-strong);font-size:.9rem;padding:.35rem .75rem}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
.linkish{background:none;border:none;color:var(--navy);text-decoration:underline;font:inherit;font-size:.95rem;min-height:44px;padding:0 .25rem;cursor:pointer}

/* layout pieces */
main{padding-bottom:3rem}
.kicker{margin:1.25rem 0 0;color:var(--muted);font-size:.9rem;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin:1rem 0}
.callout{background:var(--note);border-left:4px solid var(--gold);border-radius:6px;padding:.8rem 1rem;margin:1rem 0}
.callout > :first-child{margin-top:0}
.callout > :last-child{margin-bottom:0}
.task{font-size:1.15rem;color:var(--navy);font-weight:600}
.small{font-size:.9rem;color:var(--muted)}
.source-note{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.75rem;margin-top:2rem}
ul,ol{padding-left:1.4rem;margin:.4rem 0 .9rem}
li{margin:.25rem 0}
.letter{border-top:4px solid var(--gold)}
.letter-meta{color:var(--muted);font-size:.9rem;margin-top:0}
.reveal-item{border-left:4px solid var(--gold)}
.reveal-item h2{margin-top:0;font-size:1.1rem}
.event h2{margin-top:0;font-size:1.1rem}

/* metrics */
.metrics{display:grid;grid-template-columns:1fr;gap:.75rem;margin:.75rem 0}
@media (min-width:600px){.metrics{grid-template-columns:1fr 1fr}}
.metric{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}
.metric h3{margin:0 0 .4rem;font-size:1rem}
.metric dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.15rem .75rem;align-items:baseline}
.metric dt{color:var(--muted);font-size:.9rem}
.metric dd{margin:0;font-size:1.35rem;font-weight:700;color:var(--navy)}
.metric dd small{font-size:.85rem;font-weight:400;color:var(--muted)}

/* proposals */
.proposal{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:1rem 1.1rem;margin:1rem 0}
.proposal-head{display:flex;gap:.75rem;align-items:flex-start}
.badge{display:inline-flex;align-items:center;justify-content:center;flex:none;width:2.2rem;height:2.2rem;border-radius:50%;
  background:var(--navy);color:#fff;font-family:Georgia,"Times New Roman",serif;font-weight:700}
.proposal h2{margin:0;font-size:1.15rem}
.proposal h3{font-size:.95rem;color:var(--muted);margin:.8rem 0 .2rem}

/* forms */
.field{margin:1.1rem 0}
.field label,.field .label{display:block;font-weight:600;color:var(--navy)}
.req{font-weight:400;color:var(--danger);font-size:.85rem;margin-left:.25rem}
.opt{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:.25rem}
.hint{font-size:.9rem;color:var(--muted);margin:.15rem 0 .4rem}
input[type=text],textarea{width:100%;font:inherit;font-size:1rem;line-height:1.6;color:var(--text);background:#fff;
  border:1px solid var(--line-strong);border-radius:8px;padding:.55rem .7rem}
input[type=text]{min-height:44px}
textarea{min-height:6.5rem;resize:vertical}
input[readonly],textarea[readonly]{background:#f2efe8}
.meta{display:flex;justify-content:flex-end;font-size:.85rem;color:var(--muted)}
.err{color:var(--danger);font-size:.95rem;margin:.25rem 0 0;font-weight:600}
[aria-invalid=true]{border-color:var(--danger);border-width:2px}
fieldset{border:none;margin:1.1rem 0;padding:0;min-width:0}
legend{font-weight:600;color:var(--navy);padding:0;margin-bottom:.25rem}
.choice{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem .9rem;border:1px solid var(--line);border-radius:10px;background:#fff;
  min-height:44px;cursor:pointer;margin:.5rem 0}
.choice input{width:1.3rem;height:1.3rem;margin:.25rem 0 0;flex:none;accent-color:var(--navy)}
.choice-text{display:flex;flex-direction:column}
.choice-desc{font-size:.9rem;color:var(--muted)}
.choice.is-selected{border:2px solid var(--navy);box-shadow:inset 5px 0 0 var(--gold)}
.sel-tag{display:none;font-size:.8rem;color:var(--navy);font-weight:700}
.choice.is-selected .sel-tag{display:inline}
.choice.is-locked{cursor:default}
.form-summary{background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:.6rem .9rem;font-weight:600}
.phase{border-top:4px solid var(--gold)}
.phase h2{margin-top:0;font-size:1.1rem}
.locked-note{background:var(--ok-bg);border-radius:8px;padding:.6rem .9rem;font-size:.95rem}

/* nav */
.step-nav{margin-top:2rem}
.nav-buttons{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap}

/* record */
.compare{display:grid;grid-template-columns:1fr;gap:1rem}
@media (min-width:760px){.compare{grid-template-columns:1fr 1fr}}
.choice-block{margin:0}
.cb-title{margin-top:0}
.cb-opt{font-weight:700;color:var(--navy);font-size:1.05rem}
.qa h3{font-size:.95rem;color:var(--muted);margin:.8rem 0 .1rem}
.answer{white-space:pre-wrap;margin:0}
.answer.empty{color:var(--muted)}
.meta-time{font-size:.85rem;color:var(--muted);margin:.8rem 0 0}
.rec-sec{margin-top:1.5rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
details.cons{background:#fff;border:1px solid var(--line);border-radius:10px;margin:.75rem 0;padding:0 1rem}
details.cons > summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:.6rem;font-weight:600;color:var(--navy);padding:.5rem 0;flex-wrap:wrap}
details.cons[open] > summary{border-bottom:1px solid var(--line)}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid var(--navy);color:var(--navy);border-radius:999px;padding:0 .6rem;background:#fff}
.notice{border:2px solid var(--navy);background:#fff;border-radius:10px;padding:.8rem 1rem;font-weight:600;color:var(--navy)}

/* banner & toast */
#banner{margin-top:.5rem}
.warn{background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:.6rem .9rem;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:.5rem;pointer-events:none;max-width:calc(100vw - 32px);background:var(--navy);color:#fff;
  padding:.6rem 1rem;border-radius:8px;z-index:50;font-size:.95rem;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#toast:empty{display:none}

/* dialogs */
dialog{width:min(44rem,calc(100vw - 1rem));max-height:calc(100vh - 1rem);max-height:calc(100dvh - 1rem);padding:0;border:none;border-radius:12px;
  background:var(--bg);color:var(--text);overflow:auto}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dlg-head{position:sticky;top:0;z-index:1;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.4rem 1rem;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:1.15rem}
.dlg-body{padding:.5rem 1rem 1.5rem}
.toc{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.toc a{display:inline-flex;align-items:center;min-height:44px;padding:0 .6rem;color:var(--navy);border:1px solid var(--line);border-radius:8px;background:#fff;font-size:.9rem}
.steplist{list-style:none;padding:0;margin:.5rem 0}
.steplist li{margin:.3rem 0}
.steplist .btn{width:100%;justify-content:flex-start;text-align:left;font-size:.95rem}
.steplist .btn[aria-current=step]{background:var(--navy);color:#fff}
.timeline{list-style:none;padding:0;margin:.5rem 0}
.timeline li{border-left:3px solid var(--gold);padding:.1rem 0 .6rem .9rem;margin:0}
.timeline b{color:var(--navy);display:block}
table.simple{width:100%;border-collapse:collapse;background:#fff;font-size:.95rem}
table.simple th,table.simple td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
table.simple th{background:var(--note);color:var(--navy)}
.manual-ta{min-height:14rem;font-size:.85rem}
#askDlg{width:min(30rem,calc(100vw - 2rem))}
.ask-body{padding:1.2rem 1.2rem .6rem}
.ask-body p{font-size:1.05rem;margin-top:0}
.quote{margin:1rem 0;padding:.7rem 1rem;background:#fff;border-left:4px solid var(--navy);border-radius:0 8px 8px 0}
.quote blockquote{margin:0}
.quote p{margin:.3rem 0}
.quote figcaption{font-size:.9rem;color:var(--muted);text-align:right}
.blk-h{font-size:1rem;margin-top:1.2rem}
h4{color:var(--navy);font-size:1.05rem;margin:1.4rem 0 .3rem}
.items li{margin:.4rem 0}
.ex-title{font-size:1.1rem;margin-top:1.6rem;border-bottom:2px solid var(--gold);padding-bottom:.2rem}
.tcards{display:grid;grid-template-columns:1fr;gap:.6rem;margin:.6rem 0}
@media (min-width:600px){.tcards{grid-template-columns:1fr 1fr}}
.tcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem}
.tcard-title{font-weight:700;color:var(--navy);margin:0 0 .3rem}
.tcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.1rem .8rem}
.tcard dt{color:var(--muted);font-size:.9rem}
.tcard dd{margin:0}
#folderBody section{scroll-margin-top:4.5rem}

#print-area{display:none}
@media print{
  :root{--fs:12pt}
  body{background:#fff}
  header.app,#main,#banner,#toast,dialog,.no-print{display:none !important}
  #print-area{display:block !important;padding:0}
  .card,.proposal,details.cons{border-color:#999;break-inside:auto}
  .answer{break-inside:auto}
  h1,h2,h3{break-after:avoid}
  .compare{display:block}
  .compare > *{margin-bottom:1rem}
}
</style>
</head>
<body>
<header class="app no-print">
  <div class="bar wrap">
    <div class="brand"><span class="brand-en">CareSync</span><span class="brand-zh">整合抉擇</span></div>
    <div class="tools">
      <button type="button" class="btn btn-ghost" id="btnFolder" aria-haspopup="dialog">資料夾</button>
      <button type="button" class="btn btn-ghost" id="btnMenu" aria-haspopup="dialog">目錄與設定</button>
    </div>
  </div>
  <div class="wrap progress" id="progress"></div>
</header>
<div id="banner" class="wrap no-print"></div>
<main id="main" class="wrap"></main>
<div id="print-area" class="wrap"></div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="folderDlg" aria-labelledby="folderTitle">
  <div class="dlg-head"><h2 id="folderTitle">資料夾</h2><button type="button" class="btn btn-ghost" data-close>關閉</button></div>
  <div class="dlg-body" id="folderBody"></div>
</dialog>
<dialog id="menuDlg" aria-labelledby="menuTitle">
  <div class="dlg-head"><h2 id="menuTitle">目錄與設定</h2><button type="button" class="btn btn-ghost" data-close>關閉</button></div>
  <div class="dlg-body" id="menuBody"></div>
</dialog>
<dialog id="askDlg" aria-labelledby="askMsg">
  <div class="dlg-body ask-body"><p id="askMsg"></p>
    <div class="btn-row"><button type="button" class="btn btn-primary" id="askOk">確定</button><button type="button" class="btn" id="askCancel">取消</button></div></div>
</dialog>
<dialog id="textDlg" aria-labelledby="textTitle">
  <div class="dlg-head"><h2 id="textTitle">手動複製</h2><button type="button" class="btn btn-ghost" data-close>關閉</button></div>
  <div class="dlg-body" id="textBody"></div>
</dialog>

<script>
/* =====================================================================
   一、設定與教材資料（老師可修改此區；渲染邏輯在下方）
   ===================================================================== */
const CONFIG = {
  activityId: 'CARESYNC-INTEGRATION',   // 活動代碼（用於保存鍵與下載檔名）
  version: '1.1.0',                     // 活動版本；修改教材結構時請調升，避免與舊草稿混用
  edition: 'classroom',                 // classroom＝課堂版（不含後記）；selfstudy＝自學版
  storagePrefix: 'caresync',
  maxChars: 2000,                       // 長欄字數上限
  maxCodeChars: 40
};

/* 課堂版不含後記。自學版由老師另行產生，在此填入後記物件。 */
const EPILOGUE = null; /*EPILOGUE_SLOT*/

/* 教材內容依《CareSync 個案》學生版繁體中文 v2.5（2026-10-20）。
   段落可用：字串（一般段落）、{h:'小標'}、{quote:'引文', src:'出處'}、{ul:[...]}、
   {items:[['粗體開頭','說明'], ...]}、{table:'附表代號'}、{note:'註'}。 */
const CONTENT = {
  title: '來自加州的一封信：CareSync 的整合抉擇',
  sourceNote: '內容依《CareSync 個案》學生版（v2.5）整理；「」內為個案原文引述。公司及人名均採化名。畫面、欄位與匯出流程屬教學設計，不是公司實際事件。',
  start: {
    task: '「你是 Ken。星期一上午 9 點之前，你必須決定哪些工作繼續、哪些暫停，以及由誰作主。」',
    role: '你扮演 CareSync 創辦人兼執行長 Ken 博士。請閱讀個案證據，提出決策並寫下理由，最後比較自己前後的選擇。',
    notes: [
      '這個個案沒有標準答案。本網頁不評分、不排名，也不會告訴你哪個方案最好。',
      '作答只保存在這台裝置的瀏覽器裡。換裝置、換瀏覽器、無痕模式或清除瀏覽資料，都可能遺失草稿。',
      '完成後請下載作答檔，自行上傳到老師指定的課程平台。本網頁不會自動傳出任何資料。',
      '可用學號、座號或組別代碼代替姓名；請勿填寫電話、電子郵件等個資。'
    ],
    reading: '閱讀時請區分「文中描述的現象」、「人物對現象的解釋」與「你自己的推論」；資料不足的地方可以註記，不必自行補成事實。',
    flow: '流程：讀情境 → 初選與理由 → 證據分析 → 權責與行動計畫 → 最終決策 → 可能代價與追問 → 匯出'
  },
  anonymity: '本個案供課堂討論，公司及人名均採化名。內容依訪談與書面材料改寫；為教學討論需要，部分情節、日期與數據經整理或改寫，部分對話經重構，並非公司原始紀錄的逐項重現。中文引言為英文內容的翻譯。',

  letter: {
    meta: '2024 年 6 月・星期五晚上・台北',
    blocks: [
      '2024 年 6 月的一個星期五晚上，CareSync 創辦人兼執行長 Ken 博士獨坐台北辦公室，讀著 John Lewis 的辭職信。John 是加州 Elderlyon 公司的資深軟體工程師。六個月前，CareSync 收購了這家公司；John 已在 Elderlyon 工作十年，其旗艦產品 CareBridge 照護管理系統有很大一部分出自他手。照護機構每天都靠這套系統處理工作。',
      'John 在信中寫道：',
      { quote: '強調快速迭代（Rapid Iteration）與每週衝刺（Weekly Sprints），或許適合台灣市場，但這與我們在這裡建立的、按部就班且安全優先的開發文化根本衝突。客戶信任我們，是因為我們從不急著把關鍵醫療照護系統推上市場。[……] 我已看到同事在最近的整合會議中猶豫是否提出對時程的疑慮，因為他們知道，質疑速度可能被視為抗拒改變。當團隊成員開始對病人安全系統的專業判斷自我審查時，我們就已失去某種根本的東西，而我無法成為這種轉變的一部分。' },
      'John 也在信中提到「聲音難以被聽見」、「在地化需求被忽略」與「專業價值不受尊重」。他提出四週的離職預告。Ken 知道，John 是少數完全了解 CareBridge 舊有系統架構的工程師之一；其他員工也在觀察公司會如何回應。',
      '客戶成功長（Chief Customer Success Officer, CSO）Jennifer 已主動表示願意赴美協助整合，但 Ken 還沒有決定是否讓她接下這項任務。他已排定星期一上午 9 點與領導團隊開會。在那之前，他得想清楚：哪些事必須改變，哪些應繼續推進，又該把決策權交給誰。'
    ],
    mondayTitle: '星期一，Ken 必須回應',
    monday: ['John', '加州團隊', '董事會']
  },

  companies: [

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}
const $ = (s, r = document) => r.querySelector(s);
const nowISO = () => new Date().toISOString();
const blank = v => v == null || String(v).trim() === '';
const nn = v => blank(v) ? null : v;
const clone = o => JSON.parse(JSON.stringify(o));
function fmt(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('zh-TW', { hour12: false }); } catch (e) { return iso; }
}
function getPath(o, p) { return p.split('.').reduce((x, k) => x == null ? undefined : x[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let x = o;
  for (let i = 0; i < ks.length - 1; i++) { if (x[ks[i]] == null) x[ks[i]] = {}; x = x[ks[i]]; }
  x[ks[ks.length - 1]] = v;
}
function optLabel(id) { const o = OPTIONS.find(x => x.id === id); return o ? `${o.id}｜${o.label}` : ''; }
function planLabel(group, id) { const o = PLAN_CHOICES[group].find(x => x.id === id); return o ? o.label : ''; }
function makeId() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  let r = '';
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); r = a[0].toString(36); } catch (e) { r = Math.random().toString(36).slice(2); }
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${r.slice(0, 6)}`;
}
function safeName(s) {
  const t = String(s || '').normalize('NFKC').replace(/[^\p{L}\p{N}_-]+/gu, '_').replace(/^_+|_+$/g, '').slice(0, 40);
  return t || 'na';
}

const prefix = () => `${CONFIG.storagePrefix}:v${CONFIG.version}:${CONFIG.edition}:${CONFIG.activityId}`;
const recordKey = (cls, code) => `${prefix()}:rec:${encodeURIComponent(cls)}:${encodeURIComponent(code)}`;
const pointerKey = () => `${prefix()}:last`;
const fontKey = () => `${CONFIG.storagePrefix}:fontSize`;

function testStorage() {
  try { const k = '__caresync_test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
  catch (e) { return false; }
}
function readJSON(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!state) return;
  state.updatedAt = nowISO();
  if (!storageOK) { saveFailed = true; updateBanner(); return; }
  try {
    localStorage.setItem(recordKey(state.classCode, state.respondentCode), JSON.stringify(state));
    localStorage.setItem(pointerKey(), JSON.stringify({ classCode: state.classCode, respondentCode: state.respondentCode }));
    saveFailed = false;
  } catch (e) { saveFailed = true; }
  updateBanner(); updateSaveStatus();
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function updateBanner() {
  const b = $('#banner'); b.textContent = '';
  if (state && (!storageOK || saveFailed)) {
    b.append(h('p', { class: 'warn', role: 'alert' }, '無法自動保存（可能是無痕模式、已封鎖網站資料或儲存空間不足）。你仍可完成作答與下載，關閉前請務必下載。'));
  }
}
function updateSaveStatus() {
  const el = $('#saveStatus'); if (!el) return;
  el.textContent = !state ? '' : (storageOK && !saveFailed) ? `已自動保存在此裝置（${fmt(state.updatedAt)}）` : '無法自動保存，關閉前請下載。';
}
function removeRecord(cls, code) {
  try {
    localStorage.removeItem(recordKey(cls, code));
    const p = readJSON(pointerKey());
    if (p && p.classCode === cls && p.respondentCode === code) localStorage.removeItem(pointerKey());
  } catch (e) { /* 無法存取時忽略 */ }
}
function clearAllRecords() {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(CONFIG.storagePrefix + ':') && k !== fontKey()) keys.push(k); }
    keys.forEach(k => localStorage.removeItem(k));
  } catch (e) { /* 忽略 */ }
}

/* ---------- 表單元件 ---------- */
let fieldSeq = 0;
function textField(o) {
  const id = 'f' + (++fieldSeq);
  const max = o.max || CONFIG.maxChars;
  const val = getPath(o.obj, o.path) || '';
  const counter = h('span', { id: id + '_c' }, `${val.length}／${max} 字`);
  const err = h('p', { class: 'err', id: id + '_e', hidden: true });
  const describedBy = [o.hint ? id + '_h' : null, id + '_c', id + '_e'].filter(Boolean).join(' ');
  const input = h(o.single ? 'input' : 'textarea', {
    id, name: id, maxlength: max, rows: o.single ? null : (o.rows || 4), type: o.single ? 'text' : null,
    'aria-describedby': describedBy, readonly: o.readonly || null, autocomplete: 'off',
    'data-required': o.required ? '1' : null, 'data-missing': o.missing || '請補上這一欄', 'data-err': id + '_e'
  });
  input.value = val;
  input.addEventListener('input', () => {
    setPath(o.obj, o.path, input.value);
    counter.textContent = `${input.value.length}／${max} 字`;
    if (input.value.trim()) clearError(input);
    if (o.onInput) o.onInput(input.value);
    if (o.store !== false) scheduleSave();
  });
  return h('div', { class: 'field' },
    h('label', { for: id }, o.label, o.required ? h('span', { class: 'req' }, '（必填）') : h('span', { class: 'opt' }, '（選填）')),
    o.hint ? h('p', { class: 'hint', id: id + '_h' }, o.hint) : null,
    input, h('div', { class: 'meta' }, counter), err);
}
function choiceGroup(o) {
  const name = 'g' + (++fieldSeq);
  const err = h('p', { class: 'err', id: name + '_e', hidden: true });
  const fs = h('fieldset', { 'data-required': o.required ? '1' : null, 'data-missing': o.missing || '請選擇一項', 'data-err': name + '_e' },
    h('legend', {}, o.legend, o.required ? h('span', { class: 'req' }, '（必填）') : null));
  if (o.hint) fs.append(h('p', { class: 'hint' }, o.hint));
  const labels = [];
  const current = getPath(o.obj, o.path);
  o.options.forEach(opt => {
    const id = name + '_' + opt.id;
    const input = h('input', { type: 'radio', name, id, value: opt.id, checked: current === opt.id || null, disabled: o.readonly || null });
    const lab = h('label', { class: 'choice' + (current === opt.id ? ' is-selected' : '') + (o.readonly ? ' is-locked' : ''), for: id },
      input, h('span', { class: 'choice-text' },
        h('span', {}, h('strong', {}, opt.text || opt.label), ' ', h('span', { class: 'sel-tag' }, '✓ 已選')),
        opt.desc ? h('span', { class: 'choice-desc' }, opt.desc) : null));
    input.addEventListener('change', () => {
      if (!input.checked) return;
      setPath(o.obj, o.path, opt.id);
      labels.forEach(l => l.classList.toggle('is-selected', l === lab));
      clearError(fs);
      if (o.onChange) o.onChange(opt.id);
      scheduleSave();
    });
    labels.push(lab); fs.append(lab);
  });
  fs.append(err);
  return fs;
}
function checkGroup(o) {
  const name = 'c' + (++fieldSeq);
  const fs = h('fieldset', {}, h('legend', {}, o.legend, h('span', { class: 'opt' }, '（可複選，也可不選）')));
  const arr = getPath(o.obj, o.path) || [];
  o.options.forEach(opt => {
    const id = name + '_' + opt.id;
    const input = h('input', { type: 'checkbox', id, value: opt.id, checked: arr.includes(opt.id) || null, disabled: o.readonly || null });
    const lab = h('label', { class: 'choice' + (arr.includes(opt.id) ? ' is-selected' : ''), for: id },
      input, h('span', { class: 'choice-text' }, h('span', {}, h('strong', {}, optLabel(opt.id)), ' ', h('span', { class: 'sel-tag' }, '✓ 已勾選'))));
    input.addEventListener('change', () => {
      const list = (getPath(o.obj, o.path) || []).filter(x => x !== opt.id);
      if (input.checked) list.push(opt.id);
      list.sort();
      setPath(o.obj, o.path, list);
      lab.classList.toggle('is-selected', input.checked);
      if (o.onChange) o.onChange(list);
      scheduleSave();
    });
    fs.append(lab);
  });

}
function showError(el, msg) {
  const e = document.getElementById(el.dataset.err);

  if (el.tagName === 'FIELDSET') el.querySelectorAll('input').forEach(i => i.setAttribute('aria-invalid', 'true'));
  else el.setAttribute('aria-invalid', 'true');
}
function clearError(el) {

  else el.removeAttribute('aria-invalid');
}
function validate(root) {
  let first = null, count = 0;
  root.querySelectorAll('[data-required]').forEach(el => {
    if (el.closest('[hidden]')) { clearError(el); return; }
    const ok = el.tagName === 'FIELDSET' ? !!el.querySelector('input:checked') : el.value.trim() !== '';
    if (ok) clearError(el);
    else { showError(el, el.dataset.missing); count++; if (!first) first = el; }
  });
  const sum = root.querySelector('.form-summary');
  if (count) {
    if (sum) { sum.textContent = `還有 ${count} 個必填欄位需要補上，請查看標示的欄位。`; sum.hidden = false; }
    const target = first.tagName === 'FIELDSET' ? first.querySelector('input') : first;
    target.focus(); first.scrollIntoView({ block: 'center' });
    return false;
  }
  if (sum) sum.hidden = true;

/* ---------- 教材段落與附表 ---------- */
function renderBlocks(blocks) {
  return (blocks || []).map(b => {
    if (typeof b === 'string') return h('p', {}, b);
    if (b.h) return h('h3', { class: 'blk-h' }, b.h);
    if (b.quote) return h('figure', { class: 'quote' }, h('blockquote', {}, h('p', {}, `「${b.quote}」`)),
      b.src ? h('figcaption', {}, `——${b.src}`) : null);
    if (b.ul) return h('ul', {}, b.ul.map(x => h('li', {}, x)));
    if (b.items) return h('ul', { class: 'items' }, b.items.map(([t, d]) => h('li', {}, h('strong', {}, t), d ? '：' + d : '')));
    if (b.dialog) return h('div', { class: 'quote dialog' }, b.dialog.map(([who, line]) =>
      who ? h('p', {}, h('strong', {}, who + '：'), `「${line}」`) : h('p', { class: 'small' }, line)));
    if (b.table) return exhibitView(typeof b.table === 'string' ? EXHIBITS.find(x => x.id === b.table) : b.table, true);
    if (b.note) return h('p', { class: 'small' }, b.note);
    return null;
  });
}
/* 表格一律改排成卡片：每列一張卡片，第一欄為標題，其餘欄以「欄名：值」呈現 */
function tableCards(headers, rows) {
  return h('div', { class: 'tcards' }, rows.map(r => h('div', { class: 'tcard' },
    h('p', { class: 'tcard-title' }, r[0]),
    h('dl', {}, headers.slice(1).map((hd, i) => [h('dt', {}, hd), h('dd', {}, r[i + 1])])))));
}
function exhibitView(x, inline) {
  if (!x) return null;
  return h('section', { class: 'exhibit', id: inline ? null : 'fd-ex' + x.id, tabindex: inline ? null : '-1' },
    h(inline ? 'h3' : 'h3', { class: 'ex-title' }, x.title),
    x.rows ? tableCards(x.headers, x.rows) : null,
    x.timeline ? h('ol', { class: 'timeline' }, x.timeline.map(t => h('li', {}, h('b', {}, t[0]), t[1]))) : null,
    x.blocks ? renderBlocks(x.blocks) : null,
    x.note ? h('p', { class: 'small' }, x.note) : null);
}

function lbl(d) { return d ? d.label : null; }
function choiceCols(pre, get, isFinal) {
  const g = f => o => { const c = get(o); return c ? f(c) : null; };
  const cols = [
    [`${pre}_方案`, g(c => c.optionLabel)], [`${pre}_組合納入`, g(c => c.combinedOptions ? c.combinedOptions.join('、') : null)],
    [`${pre}_組合說明`, g(c => c.combinationNote)], [`${pre}_理由`, g(c => c.reason)], [`${pre}_個案依據`, g(c => c.evidence)],
    [`${pre}_${isFinal ? '最大代價' : '最擔心代價'}`, g(c => c.risk)]];
  if (isFinal) cols.push([`${pre}_相較初選`, g(c => c.changeFromInitial)]);

function csvCell(v) {
  let s = v == null ? '' : String(v);
  s = s.replace(/\r\n?/g, '\n');
  if (/^[=+\-@\u0000-\u001f\u007f]/.test(s)) s = "'" + s;   // 避免試算表公式注入
  return '"' + s.replace(/"/g, '""') + '"';
}
function buildCSV(rec, attempts) {
  const rows = [CSV_COLUMNS.map(c => csvCell(c[0])).join(',')];
  attempts.forEach(a => { const o = exportObject(rec, a); rows.push(CSV_COLUMNS.map(c => csvCell(c[1](o))).join(',')); });

}

/* 在 claude.ai 內開啟時，下載必須透過平台的 downloads 能力；直接開檔時用一般下載。 */
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
let downloadsApi;
async function getDownloads() {
  if (!IN_CLAUDE) return null;
  if (downloadsApi === undefined) { try { downloadsApi = await window.claude.use('downloads'); } catch (e) { downloadsApi = null; } }
  return downloadsApi;
}
async function download(name, content, mime) {
  if (IN_CLAUDE) {
    const api = await getDownloads();
    if (!api) { showManual(content.replace(/^\uFEFF/, ''), `此處無法下載：${name}`); return; }
    try {
      await api.save({ filename: name, data: content });
      exportedThisSession = true;
      toast(`已下載 ${name}。請上傳到課程指定位置。`);
    } catch (e) {
      if (e && e.code === 'declined') { toast('已取消下載'); return; }
      if (e && e.code === 'rate_limited') { toast('下載視窗已開啟，請先完成或關閉它'); return; }
      showManual(content.replace(/^\uFEFF/, ''), `無法下載：${name}`);
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const link = h('a', { href: url, download: name, hidden: true });
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    exportedThisSession = true;
    toast(`已產生 ${name}。請到下載資料夾確認，並上傳到課程指定位置。`);
  } catch (e) {
    showManual(content.replace(/^\uFEFF/, ''), `無法自動下載：${name}`);
  }
}

  } catch (e) {
    try {
      const ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0', readonly: true }); ta.value = text;
      document.body.append(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove();
      if (ok) { toast(`已複製${what}`); return; }
    } catch (e2) { /* 改用手動複製 */ }
    showManual(text, `無法自動複製${what}`);
  }
}
function showManual(text, title) {
  const body = $('#textBody'); body.textContent = '';
  $('#textTitle').textContent = title || '手動複製';
  const ta = h('textarea', { class: 'manual-ta', readonly: true, 'aria-label': '可複製的內容' }); ta.value = text;
  body.append(h('p', {}, '請點選下方「全選」，再用「複製」（手機可長按選取），貼到文字檔或課程平台中保存。'),
    ta, h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn btn-primary', onclick: () => { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); } }, '全選')));
  openDialog($('#textDlg'));
}

/* ---------- 確認視窗（不使用瀏覽器 confirm，以便在 claude.ai 內也能運作） ---------- */
function ask(message, okLabel, danger) {
  return new Promise(resolve => {
    const d = $('#askDlg'), ok = $('#askOk'), cancel = $('#askCancel');
    $('#askMsg').textContent = message;
    ok.textContent = okLabel || '確定';
    ok.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
    const prevFocus = document.activeElement;
    let done = false;
    const finish = v => {
      if (done) return; done = true;
      ok.onclick = cancel.onclick = null; d.removeEventListener('close', onClose);
      if (typeof d.close === 'function') { if (d.open) d.close(); } else d.removeAttribute('open');
      if (prevFocus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
      resolve(v);
    };
    const onClose = () => finish(false);
    ok.onclick = () => finish(true); cancel.onclick = () => finish(false);
    d.addEventListener('close', onClose);
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    cancel.focus();
  });
}

/* ---------- 列印 ---------- */
function fillPrint() {
  const pa = $('#print-area'); pa.textContent = '';
  if (!state) { pa.append(h('p', {}, '尚未開始作答。')); return; }
  const a = cur();
  pa.append(h('h1', {}, CONTENT.title), renderRecord(state, a), reflectionRecord(a),
    h('p', { class: 'small' }, `列印時間：${fmt(nowISO())}。依個案整理的互動版作答紀錄。`));
}
function doPrint() { fillPrint(); window.print(); }
window.addEventListener('beforeprint', fillPrint);

/* ---------- 對話框：資料夾、目錄 ---------- */
let lastFocus = null;
function openDialog(d) {
  lastFocus = document.activeElement;
  if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); } else d.setAttribute('open', '');
  const c = d.querySelector('[data-close]'); if (c) c.focus();
}
function closeDialog(d) {
  if (typeof d.close === 'function') { if (d.open) d.close(); } else { d.removeAttribute('open'); }
}
function closeAllDialogs() { document.querySelectorAll('dialog').forEach(closeDialog); }
document.querySelectorAll('dialog').forEach(d => {
  const c = d.querySelector('[data-close]');
  if (c) c.addEventListener('click', () => closeDialog(d));
  d.addEventListener('close', () => { if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true }); });
  d.addEventListener('click', e => { if (e.target === d) closeDialog(d); });
});
function buildFolder() {
  const b = $('#folderBody'); b.textContent = '';
  const jump = id => e => { e.preventDefault(); const s = document.getElementById(id); if (s) { s.scrollIntoView({ block: 'start' }); s.focus({ preventScroll: true }); } };
  const caseText = h('section', { id: 'fd-case', tabindex: '-1' }, h('h3', { class: 'ex-title' }, '個案正文'),
    h('details', { class: 'cons' }, h('summary', {}, '展開個案正文（與各步驟內容相同）'),
      h('h4', {}, '星期五晚上：一封辭職信'), renderBlocks(CONTENT.letter.blocks),
      CONTENT.companies.map(c => [h('h4', {}, c.title.replace(/^[①-⑤]\s*/, '')), renderBlocks(c.blocks)]),
      h('h4', {}, '六個月的摩擦'), h('p', {}, CONTENT.friction.intro),
      CONTENT.friction.events.map(e => [h('p', {}, h('strong', {}, e.title)), renderBlocks(e.blocks)]),
      renderBlocks(CONTENT.friction.after),
      h('h4', {}, '週末收到的三則訊息與 Jennifer 的提議'), renderBlocks(CONTENT.proposalsIntro.slice(0, 1)),
      CONTENT.proposals.map(p => [h('p', {}, h('strong', {}, `${p.who}：${p.title}`)), h('p', {}, p.text),
        h('ul', {}, p.moves.map(m => h('li', {}, m))), p.scope ? h('p', {}, p.scope) : null]),
      h('ul', {}, CONTENT.pressure.map(x => h('li', {}, x))),
      renderBlocks([CONTENT.kenQuote]), renderBlocks(CONTENT.closing)));
  b.append(h('div', {},
    h('p', { class: 'small' }, CONTENT.anonymity),
    h('nav', { class: 'toc', 'aria-label': '資料夾內容' },
      h('a', { href: '#fd-case', onclick: jump('fd-case') }, '正文'),
      EXHIBITS.map(x => h('a', { href: '#fd-ex' + x.id, onclick: jump('fd-ex' + x.id) }, x.id === '7b' ? '附表 7（續）' : '附表 ' + x.id))),
    caseText,
    EXHIBITS.map(x => exhibitView(x, false)),
    h('section', {}, h('h3', { class: 'ex-title' }, '公開統計資料來源'), h('ul', { class: 'small' }, EXHIBIT_SOURCES.map(s => h('li', {}, s))))));
}
function buildMenu() {
  const b = $('#menuBody'); b.textContent = '';
  const list = h('ol', { class: 'steplist' }, STEPS.map((s, i) => {
    const ok = canVisit(i);
    return h('li', {}, h('button', { type: 'button', class: 'btn', disabled: !ok || null, 'aria-current': i === viewStep ? 'step' : null,
      onclick: () => { closeDialog($('#menuDlg')); go(i); } }, i === 0 ? '開始' : `${i}. ${s.title}`, ok ? '' : '（尚未開放）'));
  }));
  const sizes = [18, 20, 22, 24];
  const curSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'), 10) || 18;
  b.append(h('h3', {}, '步驟'), list,
    h('h3', {}, '字級'),
    h('div', { class: 'btn-row', role: 'group', 'aria-label': '字級' }, sizes.map(s => h('button', { type: 'button', class: 'btn' + (s === curSize ? ' btn-primary' : ''),
      'aria-pressed': s === curSize ? 'true' : 'false', onclick: () => { setFont(s); buildMenu(); } }, `${s}px`))),
    h('h3', {}, '保存狀態'), h('p', { id: 'saveStatus', class: 'small' }),
    state ? h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn btn-danger', onclick: confirmClearCurrent }, '清除此裝置上的本次紀錄')) : null);
  updateSaveStatus();
}
function setFont(px) {
  document.documentElement.style.setProperty('--fs', px + 'px');
  try { localStorage.setItem(fontKey(), String(px)); } catch (e) { /* 忽略 */ }
}
$('#btnFolder').addEventListener('click', () => { buildFolder(); openDialog($('#folderDlg')); });
$('#btnMenu').addEventListener('click', () => { buildMenu(); openDialog($('#menuDlg')); });

window.addEventListener('beforeunload', e => {
  if (saveTimer) saveNow();
  if (state && (!storageOK || saveFailed) && !exportedThisSession) { e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) saveNow(); });

/* ---------- 啟動 ---------- */
(function init() {
  document.documentElement.lang = 'zh-Hant-TW';
  storageOK = testStorage();
  if (storageOK) {
    const f = parseInt(localStorage.getItem(fontKey()), 10);
    if ([18, 20, 22, 24].includes(f)) document.documentElement.style.setProperty('--fs', f + 'px');
    const ptr = readJSON(pointerKey());
    if (ptr) {
      const rec = readJSON(recordKey(ptr.classCode, ptr.respondentCode));
      if (rec && rec.attempts && rec.attempts.length) pending = rec;
    }
  }
  viewStep = 0;
  render();
})();
</script>
